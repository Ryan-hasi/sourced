<svg width="450" height="80" viewBox="0 0 450 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="cyanGlow" x="-10" y="-10" width="470" height="100" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="450" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="446" height="76" rx="14" fill="url(#bgGrad)" stroke="url(#cyanBorder)" stroke-width="1.5" />

  <!-- Left Icon Circle with Checkmark -->
  <g transform="translate(24, 16)">
    <!-- Outer Cyan Circle Ring -->
    <circle cx="24" cy="24" r="22" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="2" />
    <!-- Checkmark Path -->
    <path d="M14 24L21 31L34 17" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Section -->
  <!-- Main Title -->
  <text x="82" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="3">
    SOURCED
  </text>
  
  <!-- Subtitle -->
  <text x="82" y="56" fill="#8899A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" letter-spacing="1">
    CRYPTOGRAPHIC PROVENANCE PROTOCOL
  </text>

  <!-- Status Badge Right -->
  <rect x="360" y="28" width="66" height="24" rx="6" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1" />
  <text x="393" y="44" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">
    v1.1.0
  </text>
</svg>
