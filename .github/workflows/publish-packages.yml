name: Publish Packages to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ryan-hasi'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Publish Packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: https://npm.pkg.github.com
        run: |
          failed=0
          # Dependencies first, so a fresh registry resolves in order.
          for pkg in core log archive anchor conformance mcp; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            # A version can only be published once — re-pushing main must not fail the job.
            if npm view "$name@$version" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "::notice::$name@$version already published — skipping"
              continue
            fi

            echo "--- publishing $name@$version ---"
            if out=$(npm publish --workspace="$dir" --registry="$REGISTRY" 2>&1); then
              echo "$out"
              echo "::notice::published $name@$version"
            else
              echo "$out"
              # Surface the npm error as an annotation so failures are readable without log access.
              summary=$(printf '%s' "$out" | grep -Ei 'npm (error|ERR!)' | head -5 | tr '\n' ';')
              echo "::error::$name@$version failed: ${summary:-see step log}"
              failed=1
            fi
          done
          exit $failed
