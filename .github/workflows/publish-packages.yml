name: Publish Packages to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ryan-hasi'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Publish Packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes json -I -f packages/core/package.json -e 'this.publishConfig={"registry":"https://npm.pkg.github.com"}'
          npm publish --workspace=packages/core --registry=https://npm.pkg.github.com
          npm publish --workspace=packages/conformance --registry=https://npm.pkg.github.com
          npm publish --workspace=packages/log --registry=https://npm.pkg.github.com
          npm publish --workspace=packages/anchor --registry=https://npm.pkg.github.com
          npm publish --workspace=packages/archive --registry=https://npm.pkg.github.com
          npm publish --workspace=packages/mcp --registry=https://npm.pkg.github.com
