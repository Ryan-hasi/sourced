name: Publish to npm

# Publishes every workspace package whose package.json version is not yet on
# npm. Idempotent: re-pushing main with unchanged versions is a no-op, so a
# version bump in a normal commit is the whole release procedure.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance — a Sigstore attestation linking each tarball to this commit and workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC, no long-lived token) needs npm >= 11.5.1; node 22 ships 10.x.
      - run: npm install -g npm@latest

      - name: Install, build, test
        # `npm install`, not `npm ci`: the lockfile is written by npm >= 11 locally and
        # older npm rejects it as out of sync over optional peer deps — same as ci.yml.
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: https://registry.npmjs.org
        run: |
          # Auth, in order of preference:
          #   1. Trusted publishing — each package on npmjs.com lists this repo + workflow file
          #      as its GitHub Actions publisher; npm exchanges the job's OIDC token itself.
          #   2. NPM_TOKEN secret — only for bootstrapping a package that does not exist on
          #      npm yet (trusted publishers can be configured only on existing packages).
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN — publishing via OIDC trusted publishing."
          else
            echo "::notice::NPM_TOKEN present — publishing with token auth."
          fi

          failed=0
          # Dependencies first, so a fresh install of a dependent resolves in order.
          for pkg in core log archive anchor conformance mcp; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            # A version can only be published once — re-pushing main must not fail the job.
            if npm view "$name@$version" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "::notice::$name@$version already on npm — skipping"
              continue
            fi

            echo "--- publishing $name@$version ---"
            if out=$(npm publish --workspace="$dir" --access public --provenance --registry="$REGISTRY" 2>&1); then
              echo "$out"
              echo "::notice::published $name@$version"
            else
              echo "$out"
              # Surface the npm error as an annotation so failures are readable without log access.
              summary=$(printf '%s' "$out" | grep -Ei 'npm (error|ERR!)' | head -5 | tr '\n' ';')
              echo "::error::$name@$version failed: ${summary:-see step log}"
              failed=1
            fi
          done
          exit $failed
